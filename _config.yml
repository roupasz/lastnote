title: LastNote
tagline: "Keep important information safe and ready for the right moment."
description: >-
  LastNote holds the things that matter most, accounts, instructions,
  documents, locked away until the moment someone
  actually needs them.
email: "info@example.com"
demo_video_url: "./assets/images/keyholder_decrypt_vault.gif"

# --- Analytics: only loads on the production build (e.g. GitHub Pages),
# and only after the visitor accepts the consent banner ---
analytics:
  ga_measurement_id: "G-G5NSEGCZWL"

# GitHub Pages settings — change url/baseurl to match your repo
url: "https://zoisroupas.dev"
baseurl: "/lastnote"

# --- Edit these to point at your real releases ---
download:
  mac_url: "https://gitlab.com/paparoup/lastnote/-/releases/permalink/latest"
  mac_requirement: "macOS 13 or later"
  windows_url: "https://gitlab.com/paparoup/lastnote/-/releases/permalink/latest"
  windows_requirement: "Windows 10 or later"
  linux_url: "https://gitlab.com/paparoup/lastnote/-/releases/permalink/latest"
  linux_requirement: "Supported Distributions"
  linux_requirement_url: "https://gitlab.com/paparoup/lastnote/-/blob/main/README.md?ref_type=heads#supported-distributions"
  

markdown: kramdown
sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
