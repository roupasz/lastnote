title: LastNote
tagline: "Keep important information safe and ready for the right moment."
description: >-
  LastNote is a desktop app for keeping the information that matters most —
  passwords, instructions, accounts, documents — safe, organized, and ready
  for the moment someone actually needs it.
email: "hello@example.com"

# GitHub Pages settings — change url/baseurl to match your repo
url: "https://yourusername.github.io"
baseurl: "/lastnote"

# --- Edit these to point at your real releases ---
download:
  version: "1.0"
  mac_url: "#"
  mac_requirement: "macOS 13 or later"
  windows_url: "#"
  windows_requirement: "Windows 10 or later"

markdown: kramdown
sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
