<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Tell the browser NOT to automatically restore scroll or jump to hashes on refresh
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    // Force top on load if a stale hash exists
    if (window.location.hash) {
      window.history.replaceState('', document.title, window.location.pathname + window.location.search);
      window.scrollTo(0, 0);
    }
  </script>
  <!-- Set the day/night theme before paint, so there's no flash of the wrong colors -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('lastnote-theme'); } catch (e) {}
      if (saved === 'day' || saved === 'night') {
        document.documentElement.setAttribute('data-theme', saved);
        return;
      }
      var hour = new Date().getHours();
      var isNight = hour < 6 || hour >= 19;
      document.documentElement.setAttribute('data-theme', isNight ? 'night' : 'day');
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }} — {{ site.tagline }}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#7B68A6">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__row">
      <a class="wordmark-container" href="{{ '/' | relative_url }}">
        <span class="wordmark">LastNote</span>
        <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="LastNote Logo" class="site-logo">
      </a>
      <nav class="site-nav">
        <a href="#features">Features</a>
        <a href="#how-it-works">How it Works</a>
        <a href="#download" class="site-nav__cta">Download</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch between day and night theme">
          <span class="theme-toggle__icon theme-toggle__icon--sun">&#9728;</span>
          <span class="theme-toggle__icon theme-toggle__icon--moon">&#9789;</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__row">
      <div>
        <p class="wordmark wordmark--small" style="color: #7ED8D1;">LastNote</p>
        <p class="muted">© {{ 'now' | date: "%Y" }} LastNote. Secure, Synchronized, Local.</p>
      </div>
      <div class="site-footer__contact">
        <p class="muted">Questions or feedback</p>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
